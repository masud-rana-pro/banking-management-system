spring.config.import=optional:file:./application-local.properties
spring.application.name=sbms-backend

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SBMS_DB_URL:jdbc:mysql://localhost:3306/sbms}
spring.datasource.username=${SBMS_DB_USERNAME:root}
spring.datasource.password=${SBMS_DB_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=${SBMS_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Flyway initializes a new database from the versioned baseline migration.
# Existing non-empty databases are baselined at V1 and keep their current data.
spring.flyway.enabled=${SBMS_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.orm.jdbc.extract=WARN

file.upload-dir=${SBMS_UPLOAD_DIR:src/main/resources/uploads/}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.output.ansi.enabled=ALWAYS
logging.exception-conversion-word=%wEx{full}

# SMTP and OTP delivery are disabled until valid local credentials are supplied.
spring.mail.host=${SBMS_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SBMS_MAIL_PORT:587}
spring.mail.username=${SBMS_MAIL_USERNAME:}
spring.mail.password=${SBMS_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${SBMS_MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

sbms.verification.delivery.simulator-fallback-enabled=${SBMS_OTP_SIMULATOR_ENABLED:false}
sbms.verification.delivery.email.enabled=${SBMS_EMAIL_ENABLED:false}
sbms.verification.delivery.email.provider-name=${SBMS_EMAIL_PROVIDER:GMAIL_SMTP}
sbms.verification.delivery.email.from-address=${SBMS_MAIL_FROM:}
sbms.verification.delivery.email.subject-prefix=${SBMS_MAIL_SUBJECT_PREFIX:SBMS}

sbms.verification.delivery.sms.enabled=${SBMS_SMS_ENABLED:false}
sbms.verification.delivery.sms.provider-name=${SBMS_SMS_PROVIDER:HTTP_GATEWAY}
sbms.verification.delivery.sms.endpoint-url=${SBMS_SMS_ENDPOINT_URL:}
sbms.verification.delivery.sms.method=${SBMS_SMS_METHOD:POST}
sbms.verification.delivery.sms.auth-header-name=${SBMS_SMS_AUTH_HEADER_NAME:Authorization}
sbms.verification.delivery.sms.auth-header-value=${SBMS_SMS_AUTH_HEADER_VALUE:}
sbms.verification.delivery.sms.sender-id=${SBMS_SMS_SENDER_ID:SBMS}
sbms.verification.delivery.sms.content-type=${SBMS_SMS_CONTENT_TYPE:application/json}
sbms.verification.delivery.sms.payload-template=${SBMS_SMS_PAYLOAD_TEMPLATE:}
sbms.verification.delivery.sms.success-keyword=${SBMS_SMS_SUCCESS_KEYWORD:}

sbms.mail.app-base-url=${SBMS_APP_BASE_URL:http://localhost:4200}
sbms.mail.support-email=${SBMS_SUPPORT_EMAIL:support@example.com}
sbms.mail.support-phone=${SBMS_SUPPORT_PHONE:}

